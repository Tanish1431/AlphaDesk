# Render Blueprint — Deploy AlphaDesks with one click
# https://render.com/docs/blueprint-spec

services:
  # Backend API
  - type: web
    name: alphadesks-api
    runtime: node
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: MONGO_URL
        sync: false  # Set manually in Render dashboard
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false  # Set to your frontend Render URL
      - key: NODE_ENV
        value: production

  # Frontend Static Site
  - type: web
    name: alphadesks
    runtime: static
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: build
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: REACT_APP_API_URL
        sync: false  # Set to your backend Render URL + /api
